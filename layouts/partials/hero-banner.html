<section class="salon-hero">
  <div class="salon-hero-inner">
    <div class="salon-hero-lockup">
      <span class="salon-hero-mark" aria-hidden="true"></span>
      <div class="salon-hero-copy">
        <p class="salon-hero-kicker">Listen River</p>
        <div class="salon-hero-headline">
          <h1 class="salon-hero-title">聆聽的河流</h1>
          <p class="salon-hero-topics">閱讀｜書寫｜心理｜社工</p>
        </div>
        <div class="salon-hero-bottom">
          {{- with .Site.Params.salonDescription }}
          <div class="salon-channel-desc">{{ . }}</div>
          {{- end }}
        </div>
      </div>
    </div>
  </div>
</section>
