<nav class="mobile-reading-toolbar" data-mobile-reading-toolbar aria-label="手機文章閱讀工具列">
  <button class="mobile-reading-toolbar__item" type="button" data-mobile-reading-back data-fallback-url="{{ "/" | relLangURL }}" aria-label="上一頁">
    <span class="mobile-reading-toolbar__icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 18l-6-6 6-6"></path>
      </svg>
    </span>
    <span class="mobile-reading-toolbar__label">上一頁</span>
  </button>

  <a class="mobile-reading-toolbar__item" href="{{ "/categories/" | relLangURL }}" aria-label="探索主題">
    <span class="mobile-reading-toolbar__icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 6.5h16"></path>
        <path d="M6.5 12h11"></path>
        <path d="M9 17.5h6"></path>
      </svg>
    </span>
    <span class="mobile-reading-toolbar__label">探索主題</span>
  </a>

  <button class="mobile-reading-toolbar__item" type="button" data-mobile-reading-related aria-label="跳到延伸閱讀">
    <span class="mobile-reading-toolbar__icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 5.5h10a4 4 0 0 1 4 4v9H9a4 4 0 0 1-4-4v-9Z"></path>
        <path d="M9 9h6"></path>
        <path d="M9 13h4"></path>
      </svg>
    </span>
    <span class="mobile-reading-toolbar__label">延伸閱讀</span>
  </button>

  <button class="mobile-reading-toolbar__item" type="button" data-mobile-reading-share aria-label="分享目前頁面">
    <span class="mobile-reading-toolbar__icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"></path>
        <path d="M12 16V4"></path>
        <path d="M7.5 8.5 12 4l4.5 4.5"></path>
      </svg>
    </span>
    <span class="mobile-reading-toolbar__label">分享</span>
  </button>

  <span class="mobile-reading-toolbar__toast" data-mobile-reading-toast role="status" aria-live="polite">已複製連結</span>
</nav>

<script>
  (function () {
    const toolbar = document.querySelector('[data-mobile-reading-toolbar]');
    if (!toolbar) return;

    const backButton = toolbar.querySelector('[data-mobile-reading-back]');
    const relatedButton = toolbar.querySelector('[data-mobile-reading-related]');
    const shareButton = toolbar.querySelector('[data-mobile-reading-share]');
    const toast = toolbar.querySelector('[data-mobile-reading-toast]');
    const mobileMedia = window.matchMedia('(max-width: 768px)');
    let lastY = window.scrollY;
    let ticking = false;
    let hideTravel = 0;
    let revealTravel = 0;
    let toolbarMode = 'full';
    let compactSince = 0;
    let revealCompactSince = 0;
    const alwaysVisibleOffset = 320;
    const compactDistance = 72;
    const hideDistance = 300;
    const revealCompactDistance = 32;
    const revealFullDistance = 72;
    const compactMinDuration = 700;
    const revealCompactMinDuration = 450;

    function setToolbarMode(mode) {
      toolbarMode = mode;
      if (mode === 'compact') {
        compactSince = Date.now();
      } else {
        compactSince = 0;
      }
      if (mode !== 'compact') {
        revealCompactSince = 0;
      }
      toolbar.classList.toggle('is-compact', mode === 'compact');
      toolbar.classList.toggle('is-hidden', mode === 'hidden');
    }

    function showToolbar() {
      setToolbarMode('full');
    }

    function compactToolbar() {
      setToolbarMode('compact');
    }

    function revealCompactToolbar() {
      setToolbarMode('compact');
      revealCompactSince = Date.now();
    }

    function hideToolbar() {
      setToolbarMode('hidden');
    }

    function resetScrollState() {
      hideTravel = 0;
      revealTravel = 0;
      lastY = Math.max(window.scrollY, 0);
      showToolbar();
    }

    function updateToolbarVisibility() {
      if (!mobileMedia.matches) {
        resetScrollState();
        ticking = false;
        return;
      }

      const y = Math.max(window.scrollY, 0);
      const diff = y - lastY;

      if (y <= alwaysVisibleOffset || document.activeElement && toolbar.contains(document.activeElement)) {
        resetScrollState();
        ticking = false;
        return;
      }

      if (diff > 0) {
        hideTravel += diff;
        revealTravel = 0;
        revealCompactSince = 0;
        if (toolbarMode === 'full' && hideTravel >= compactDistance) {
          compactToolbar();
          hideTravel = 0;
        } else if (toolbarMode === 'compact' && hideTravel >= hideDistance && Date.now() - compactSince >= compactMinDuration) {
          hideToolbar();
          hideTravel = 0;
        }
      } else if (diff < 0) {
        revealTravel += Math.abs(diff);
        hideTravel = 0;
        if (toolbarMode === 'hidden' && revealTravel >= revealCompactDistance) {
          revealCompactToolbar();
          revealTravel = 0;
        } else if (toolbarMode === 'compact' && revealTravel >= revealFullDistance && (!revealCompactSince || Date.now() - revealCompactSince >= revealCompactMinDuration)) {
          showToolbar();
          revealTravel = 0;
        }
      }

      lastY = y;
      ticking = false;
    }

    window.addEventListener('scroll', function () {
      if (ticking) return;
      ticking = true;
      window.requestAnimationFrame(updateToolbarVisibility);
    }, { passive: true });

    mobileMedia.addEventListener('change', resetScrollState);

    if (backButton) {
      backButton.addEventListener('click', function () {
        if (window.history.length > 1) {
          window.history.back();
          return;
        }
        window.location.href = backButton.getAttribute('data-fallback-url') || '/';
      });
    }

    if (relatedButton) {
      const relatedTarget = document.getElementById('related-posts');
      if (!relatedTarget) {
        relatedButton.classList.add('is-disabled');
        relatedButton.disabled = true;
        relatedButton.setAttribute('aria-disabled', 'true');
      } else {
        relatedButton.addEventListener('click', function () {
          showToolbar();
          relatedTarget.scrollIntoView({
            behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth',
            block: 'start'
          });
          if (window.history && window.history.pushState) {
            window.history.pushState(null, '', '#related-posts');
          }
        });
      }
    }

    function showToast() {
      if (!toast) return;
      showToolbar();
      toast.classList.add('is-visible');
      window.setTimeout(function () {
        toast.classList.remove('is-visible');
      }, 1600);
    }

    function copyUrl() {
      const url = window.location.href;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        return navigator.clipboard.writeText(url).then(showToast);
      }
      const input = document.createElement('input');
      input.value = url;
      input.setAttribute('readonly', '');
      input.style.position = 'fixed';
      input.style.opacity = '0';
      document.body.appendChild(input);
      input.select();
      try {
        document.execCommand('copy');
        showToast();
      } finally {
        document.body.removeChild(input);
      }
      return Promise.resolve();
    }

    if (shareButton) {
      shareButton.addEventListener('click', function () {
        const shareData = {
          title: document.title,
          url: window.location.href
        };
        if (navigator.share) {
          navigator.share(shareData).catch(function () {});
          return;
        }
        copyUrl();
      });
    }

    resetScrollState();
  })();
</script>
