{{- define "main" -}}
<header class="page-header search-page-header">
  {{- partial "breadcrumbs.html" . -}}
  <span class="taxonomy-page-kicker">Search</span>
  <h1>搜尋</h1>
  <div class="post-description taxonomy-page-description">
    {{- if .Description -}}
      {{ .Description | markdownify }}
    {{- else -}}
      搜尋站內文章、分類與主題標籤。
    {{- end -}}
  </div>
</header>

<div class="search-pagefind-shell">
  <div id="pagefind-search"></div>
</div>
<link rel="stylesheet" href="{{ "/pagefind/pagefind-ui.css" | relLangURL }}">
<script src="{{ "/pagefind/pagefind-ui.js" | relLangURL }}" defer></script>
<script defer>
  window.addEventListener("DOMContentLoaded", function () {
    if (!window.PagefindUI) {
      return;
    }

    new window.PagefindUI({
      element: "#pagefind-search",
      showSubResults: false,
      autofocus: true,
      resetStyles: false,
      translations: {
        placeholder: "搜尋文章、分類、主題",
        clear_search: "清除",
        load_more: "載入更多",
        search_label: "搜尋",
        filters_label: "篩選",
        zero_results: "找不到相關內容",
        many_results: "[COUNT] 筆結果"
      }
    });

    const searchParams = new URLSearchParams(window.location.search);
    const initialQuery = (searchParams.get("q") || "").trim();
    const searchRoot = document.querySelector("#pagefind-search");
    let syncTimer;

    function findPagefindInput() {
      return searchRoot ? searchRoot.querySelector(".pagefind-ui__search-input, input[type='search'], input[type='text']") : null;
    }

    function updateSearchUrl(query) {
      const nextUrl = new URL(window.location.href);
      if (query) {
        nextUrl.searchParams.set("q", query);
      } else {
        nextUrl.searchParams.delete("q");
      }
      window.history.replaceState(null, "", nextUrl);
    }

    function submitQuery(input, query) {
      input.value = query;
      input.dispatchEvent(new InputEvent("input", {
        bubbles: true,
        inputType: "insertText",
        data: query
      }));
    }

    function scheduleUrlSync(input) {
      window.clearTimeout(syncTimer);
      syncTimer = window.setTimeout(function () {
        updateSearchUrl(input.value.trim());
      }, 150);
    }

    function connectInput(attemptsLeft) {
      const input = findPagefindInput();
      if (!input) {
        if (attemptsLeft > 0) {
          window.setTimeout(function () {
            connectInput(attemptsLeft - 1);
          }, 50);
        }
        return;
      }

      if (initialQuery) {
        submitQuery(input, initialQuery);
      }

      input.addEventListener("input", function () {
        scheduleUrlSync(input);
      });

      searchRoot.addEventListener("click", function (event) {
        if (!event.target.closest(".pagefind-ui__search-clear")) {
          return;
        }

        window.setTimeout(function () {
          const clearedInput = findPagefindInput();
          if (clearedInput) {
            scheduleUrlSync(clearedInput);
          }
        }, 0);
      });
    }

    connectInput(40);
  });
</script>
{{- end -}}
